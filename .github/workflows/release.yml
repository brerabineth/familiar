name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run bundle
      - run: node dist/familiar.cjs scan --home . --cwd . --plain || true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/familiar.cjs
          generate_release_notes: true
